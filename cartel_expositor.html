<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cartel Expositor Raúl Hernández</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        @page { size: A5 landscape; margin: 0; }
        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            color: #1A1A1A; text-align: center;
            background-color: #ffffff;
            width: 210mm; height: 148mm;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .title { 
            font-family: 'Playfair Display', serif; 
            font-size: 42pt; 
            font-weight: 600; 
            margin-bottom: 15mm; 
            letter-spacing: 1px; 
            color: #2c2c2c;
        }
        .container { display: flex; width: 100%; justify-content: space-around; padding: 0 10mm; box-sizing: border-box; }
        .column { display: flex; flex-direction: column; align-items: center; width: 45%; }
        .qr-container { position: relative; width: 65mm; height: 65mm; }
        .qr-img { width: 100%; height: 100%; }
        
        /* CORRECCIÓN: Restringimos el ancho del logotipo para no tapar el QR */
        .logo-center-wrapper {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 4px 8px; border-radius: 4px;
            width: 28mm; /* Ancho máximo seguro del 30% */
            display: flex; justify-content: center; align-items: center;
        }
        .sig-img { 
            width: 100%; height: auto; display: block; 
            mix-blend-mode: multiply;
        }
        
        .logo-center-ig-wrapper {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
        }
        .label { 
            font-family: 'Inter', sans-serif; 
            font-size: 13pt; 
            color: #78350f;
            margin-top: 6mm; 
            letter-spacing: 2px; 
            font-weight: 600; 
        }
    </style>
</head>
<body>
    <div class="title">Sígueme en redes sociales</div>
    <div class="container">
        <!-- Columna Web -->
        <div class="column">
            <div class="qr-container">
                <img class="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://raulhernandez.netlify.app/publica.html&ecc=H" alt="QR Web" />
                <div class="logo-center-wrapper">
                    <img class="sig-img" src="firma.png" alt="Firma" onerror="this.style.display='none'" />
                </div>
            </div>
            <div class="label">CATÁLOGO WEB</div>
        </div>
        <!-- Columna Instagram -->
        <div class="column">
            <div class="qr-container">
                <img class="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://instagram.com/raulhernandezme&ecc=H" alt="QR IG" />
                <div class="logo-center-ig-wrapper">
                    <svg viewBox="0 0 24 24" style="width: 13mm; height: 13mm;">
                        <defs>
                            <linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#f09433" />
                                <stop offset="25%" stop-color="#e6683c" />
                                <stop offset="50%" stop-color="#dc2743" />
                                <stop offset="75%" stop-color="#cc2366" />
                                <stop offset="100%" stop-color="#bc1888" />
                            </linearGradient>
                        </defs>
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="none" stroke="url(#ig-grad)" stroke-width="2.5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" fill="none" stroke="url(#ig-grad)" stroke-width="2.5"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke="url(#ig-grad)" stroke-width="2.5" stroke-linecap="round"></line>
                    </svg>
                </div>
            </div>
            <div class="label">INSTAGRAM</div>
        </div>
    </div>
</body>
</html>
